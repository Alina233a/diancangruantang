<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叙岑盒</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="title-wrapper">
            <h1 id="main-title" style="-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;" title="电脑右键 / 手机长按进入设置">叙岑盒</h1>
            <span class="subtitle">My API Collection</span>
        </div>
    </header>

    <div class="category-bar">
        <div class="category-tabs" id="category-tabs"></div>
        <div class="cat-actions">
            <button class="manage-cat-btn hand-drawn-border" onclick="openManageMenu()">管理 ⊞</button>
        </div>
    </div>

    <main>
        <div id="api-container" class="api-grid"></div>
    </main>

    <button id="add-btn" class="fab">+</button>

    <div id="batch-action-bar" class="bottom-action-sheet hidden">
        <div class="action-item" onclick="moveUp()">
            <div class="action-icon icon-purple">↑</div>
            <span class="text-purple">上移</span>
        </div>
        <div class="action-item" onclick="moveDown()">
            <div class="action-icon icon-purple">↓</div>
            <span class="text-purple">下移</span>
        </div>
        <div class="action-item" onclick="batchDelete()">
            <div class="action-icon icon-pink">✖</div>
            <span class="text-pink">删除</span>
        </div>
        <div class="action-item" onclick="showBatchMove()">
            <div class="action-icon icon-purple">⤻</div>
            <span class="text-purple">追加</span>
        </div>
        <div class="action-item count-item">
            <div class="action-icon icon-purple-solid" id="batch-count-num">0</div>
            <span class="text-purple">已选</span>
        </div>
        <div class="action-item" onclick="toggleBatchMode()">
            <div class="action-icon icon-blue">⮌</div>
            <span class="text-blue">退出</span>
        </div>
    </div>

    <div id="manage-menu-overlay" class="hidden">
        <div class="modal hand-drawn-border manage-menu-modal">
            <h2 style="margin-bottom: 10px; font-size: 1.2rem;">要管理什么呢 ૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</h2>
            <button onclick="toggleBatchMode(); closeManageMenu()" class="macaron-btn btn-blue menu-btn">批量管理卡片 ⊞</button>
            <button onclick="openCategoryManage(); closeManageMenu()" class="macaron-btn btn-pink menu-btn">添加/删除分类 ✎</button>
            <button onclick="closeManageMenu()" class="macaron-btn btn-disabled menu-btn">取消 ✖</button>
        </div>
    </div>

    <div id="batch-move-overlay" class="hidden">
        <div class="modal hand-drawn-border" style="text-align: center;">
            <div class="tape top-center"></div>
            <h2 style="margin-bottom: 10px; font-size: 1.2rem;">追加分类 ⤻</h2>
            <p style="font-size: 0.8rem; color: var(--main-purple); margin-bottom: 15px;">(点击选中要追加的分类标签)</p>
            <div id="batch-category-list" class="multi-cat-container"></div>
            <div class="modal-actions">
                <button onclick="closeBatchMove()" class="btn-cancel hand-drawn-border">取消</button>
                <button onclick="batchMove()" class="btn-save hand-drawn-border">确定追加</button>
            </div>
        </div>
    </div>

    <div id="detail-modal-overlay" class="hidden">
        <div class="notebook-paper" id="detail-paper">
            <div class="binding-holes">
                <div class="hole"></div><div class="hole"></div><div class="hole"></div>
                <div class="hole"></div><div class="hole"></div><div class="hole"></div>
            </div>
            <div class="tape top-right"></div>
            <button id="close-detail-btn" class="close-btn" onclick="editApiInfo()" title="修改信息">✎</button>
            
            <div id="page-1" class="page-wrapper">
                <h2><span id="detail-name">API 名称</span></h2>
                <div class="detail-content">
                    <p><strong>URL：</strong><br><span class="box-text copyable" id="detail-url" onclick="copyText(event, this.innerText)" title="点击复制"></span></p>
                    <p><strong>KEY：</strong><br><span class="box-text copyable" id="detail-key" onclick="copyText(event, this.innerText)" title="点击复制"></span></p>
                    <p><strong>邀人链接：</strong><br><span class="box-text copyable" id="detail-share" onclick="copyText(event, this.innerText)" title="点击复制"></span></p>
                </div>
                <div class="flip-actions">
                    <button class="flip-btn" onclick="flipPage(2)">下一页：模型 &gt;</button>
                </div>
            </div>

            <div id="page-2" class="d-none page-wrapper">
                <h2>添加模型</h2>
                <div class="add-model-group">
                    <input type="text" id="new-model-input" placeholder="输入模型名 (如gpt-4)">
                    <button onclick="addModel()" class="sticker-btn btn-green">添加</button>
                </div>
                <div id="model-list" class="model-list"></div>
                <div class="flip-actions">
                    <button class="flip-btn" onclick="flipPage(1)">&lt; 上一页：详情</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="hidden">
        <div class="modal hand-drawn-border">
            <div class="tape top-center"></div>
            <h2>记录新的 API ✎</h2>
            <form id="api-form">
                <div class="input-group">
                    <label for="api-name">API 名称</label>
                    <input type="text" id="api-name" required placeholder="给它起个名字吧＞𐋣＜">
                </div>
                <div class="input-group">
                    <label for="api-url">API URL</label>
                    <input type="url" id="api-url" required placeholder="https://...">
                </div>
                <div class="input-group">
                    <label for="api-key">API Key</label>
                    <input type="text" id="api-key" placeholder="填写密钥 (选填)">
                </div>
                <div class="input-group">
                    <label for="api-share">邀人链接</label>
                    <input type="url" id="api-share" placeholder="邀请新人链接 (选填)">
                </div>
                <div class="input-group">
                    <label>所属分类 (可多选)</label>
                    <div id="api-category-list" class="multi-cat-container left-align"></div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn-cancel hand-drawn-border">取消</button>
                    <button type="submit" class="btn-save hand-drawn-border">保存入盒</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 现代极简风设置面板 (无胶带，无Emoji) -->
    <div id="settings-overlay" class="hidden" onclick="if(event.target===this)closeSettings()">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>设置与备份</h2>
                <button type="button" class="close-icon-btn" onclick="closeSettings()" title="关闭">✖</button>
            </div>
            
            <div class="settings-body">
                <div class="settings-section">
                    <h3>❖ 外观主题</h3>
                    <p class="settings-tip">选择你喜欢的色彩风格，自动保存</p>
                    <div class="input-group">
                        <select id="theme-selector" class="hand-drawn-select" onchange="changeTheme(this.value)">
                            <option value="default">紫点便笺 (默认)</option>
                            <option value="subi">素笔闲抄</option>
                            <option value="tingyu">檐下听雨</option>
                            <option value="baiyu">白隅清章</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>❖ GitHub 云端同步</h3>
                    <p class="settings-tip">填写 Token 即可直接与 GitHub 仓库同步数据</p>
                    <div class="input-group">
                        <label>GitHub Token (须勾选 repo 权限)</label>
                        <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                    </div>
                    <div class="input-group">
                        <label>用户名 (Username)</label>
                        <input type="text" id="gh-username" placeholder="你的 GitHub 用户名">
                    </div>
                    <div class="input-group">
                        <label>仓库名 (Repository)</label>
                        <input type="text" id="gh-repo" value="xucenhe-backup">
                    </div>
                    <div class="input-group">
                        <label>文件名 (File Path)</label>
                        <input type="text" id="gh-path" value="xucenhe_backup.json">
                    </div>
                    <div class="settings-actions">
                        <button type="button" onclick="syncToGithub()" class="macaron-btn btn-blue">↑ 备份到云端</button>
                        <button type="button" onclick="syncFromGithub()" class="macaron-btn btn-yellow">↓ 从云端恢复</button>
                    </div>
                </div>

                <div class="settings-section">
                    <h3>❖ 本地文件备份</h3>
                    <p class="settings-tip">下载文件保存，或读取本地文件恢复</p>
                    <div class="settings-actions">
                        <button type="button" onclick="exportData()" class="macaron-btn btn-green">↑ 导出备份文件</button>
                        <button type="button" onclick="triggerImport()" class="macaron-btn btn-pink">↓ 导入备份文件</button>
                        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
